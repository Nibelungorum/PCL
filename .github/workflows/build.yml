name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      shell: pwsh
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CF_KEY: ${{ secrets.CF_KEY }}
      run: |
        $secretPath = "Plain Craft Launcher 2\Modules\ModSecret.vb"
        $source = Get-Content -LiteralPath $secretPath -Raw
        foreach ($entry in @(
          @{ Variable = 'PCL_MS_CLIENT_ID'; Value = $env:CLIENT_ID },
          @{ Variable = 'PCL_CURSEFORGE_API_KEY'; Value = $env:CF_KEY }
        )) {
          if ($entry.Value -match '[\r\n]') { throw 'Build credentials must be single-line values.' }
          $original = 'Environment.GetEnvironmentVariable("' + $entry.Variable + '"), ""'
          if (-not $source.Contains($original)) { throw "Credential placeholder not found: $($entry.Variable)" }
          $replacement = 'Environment.GetEnvironmentVariable("' + $entry.Variable + '"), "' + ([string]$entry.Value).Replace('"', '""') + '"'
          $source = $source.Replace($original, $replacement)
        }
        Set-Content -LiteralPath $secretPath -Value $source -Encoding utf8 -NoNewline
        $basePath = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $source = Get-Content -LiteralPath $basePath -Raw
        $source = $source.Replace('Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "' + $env:GITHUB_SHA + '"')
        Set-Content -LiteralPath $basePath -Value $source -Encoding utf8 -NoNewline
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
